<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Compiler | C Learning Hub</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;padding:24px 16px}
main{max-width:900px;margin:auto} h1{margin:0 0 6px} p{color:#aaa}
.editor{display:grid;grid-template-columns:1fr;gap:12px}
textarea,pre{width:100%;min-height:320px;box-sizing:border-box;background:#111;color:#fff;border:1px solid #555;border-radius:8px;padding:14px;font:14px ui-monospace,monospace;line-height:1.5}
textarea{resize:vertical}.keys{display:flex;flex-wrap:wrap;gap:6px}
button,.back{background:#111;color:#fff;border:1px solid #777;border-radius:6px;padding:9px 12px;cursor:pointer}
button:hover,.back:hover{background:#333}.run{border-color:#fff;margin-top:12px}.status{color:#aaa}.back{display:inline-block;text-decoration:none;margin-bottom:20px}
</style>
</head>
<body><main>
<a class="back" href="../">← Back to hub</a>
<h1>Online C Compiler</h1>
<p>Write C, use the quick keyboard below, and compile/run it using the free Piston compiler service.</p>
<div class="editor">
<textarea id="code" spellcheck="false">#include &lt;stdio.h&gt;

int main(void) {
    printf("Hello, C Learning Hub!\n");
    return 0;
}</textarea>
<label>Program input (optional)<textarea id="input" rows="3" style="min-height:80px"></textarea></label>
<div class="keys" aria-label="C keyboard shortcuts">
<button data-insert="#include &lt;&gt;">#include &lt;&gt;</button><button data-insert="printf(&quot;&quot;);">printf()</button><button data-insert="scanf(&quot;&quot;, &amp;);">scanf()</button><button data-insert="int ">int</button><button data-insert="char ">char</button><button data-insert="void ">void</button><button data-insert="{}">{ }</button><button data-insert="();">( )</button><button data-insert="[]">[ ]</button><button data-insert="&quot;&quot;">" "</button><button data-insert="&amp;&amp;">&amp;&amp;</button><button data-insert="||">||</button><button data-insert="==">==</button><button data-insert="; ">;</button></div>
<button class="run" id="run">Compile &amp; Run</button>
<span class="status" id="status"></span>
<pre id="output" aria-live="polite">Output will appear here.</pre>
</div>
<script>
const code=document.querySelector('#code'), input=document.querySelector('#input'), output=document.querySelector('#output'), status=document.querySelector('#status');
document.querySelectorAll('[data-insert]').forEach((button)=>button.addEventListener('click',()=>{
 const text=button.dataset.insert.replaceAll('&lt;','<').replaceAll('&gt;','>').replaceAll('&amp;','&').replaceAll('&quot;','"');
 const start=code.selectionStart,end=code.selectionEnd; code.setRangeText(text,start,end,'end'); code.focus();
}));
document.querySelector('#run').addEventListener('click',async()=>{
 const button=document.querySelector('#run'); status.textContent=' Compiling…'; output.textContent=''; button.disabled=true;
 try{
  const response=await fetch('https://emkc.org/api/v2/piston/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:'c',version:'10.2.0',files:[{name:'main.c',content:code.value}],stdin:input.value})});
  const data=await response.json(); const result=data.run||data.compile;
  output.textContent=result?(result.stdout||'')+(result.stderr?'\n'+result.stderr:''):(data.message||'No output.');
  status.textContent=response.ok?' Done.':' Failed.';
 }catch(error){output.textContent='The free compiler service is unavailable right now. Please try again.';status.textContent=' Offline.';}
 finally{button.disabled=false;}
});
</script>
</body></html>
